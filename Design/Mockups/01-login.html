<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Login</title>
<style>
:root {
  --color-primary: #2563EB;
  --color-primary-hover: #1D4ED8;
  --color-primary-light: #DBEAFE;
  --color-secondary: #3B82F6;
  --color-accent: #059669;
  --color-background: #F8FAFC;
  --color-surface: #FFFFFF;
  --color-foreground: #0F172A;
  --color-foreground-muted: #64748B;
  --color-border: #E2E8F0;
  --color-border-strong: #CBD5E1;
  --color-destructive: #DC2626;
  --color-destructive-light: #FEF2F2;
  --color-warning: #D97706;
  --color-warning-light: #FFFBEB;
  --color-ring: #2563EB;
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --text-h1: clamp(24px, 5vw, 28px);
  --text-h2: clamp(20px, 4vw, 22px);
  --text-h3: 18px;
  --text-body-lg: 16px;
  --text-body: 15px;
  --text-body-sm: 13px;
  --text-caption: 12px;
  --text-button: 15px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-full: 9999px;
  --elevation-1: 0 1px 2px rgba(15,23,42,0.05);
  --elevation-2: 0 4px 8px rgba(15,23,42,0.08);
  --elevation-3: 0 8px 24px rgba(15,23,42,0.12);
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-primary: #3B82F6; --color-primary-hover: #60A5FA; --color-primary-light: #1E3A5F;
    --color-secondary: #60A5FA; --color-accent: #34D399;
    --color-background: #0F172A; --color-surface: #1E293B;
    --color-foreground: #F8FAFC; --color-foreground-muted: #94A3B8;
    --color-border: #334155; --color-border-strong: #475569;
    --color-destructive: #EF4444; --color-destructive-light: #450A0A;
    --color-warning: #FBBF24; --color-warning-light: #451A03;
    --color-ring: #3B82F6;
    --elevation-1: 0 1px 2px rgba(0,0,0,0.3);
    --elevation-2: 0 4px 8px rgba(0,0,0,0.4);
    --elevation-3: 0 8px 24px rgba(0,0,0,0.5);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { font-family: var(--font-family); background: var(--color-background); color: var(--color-foreground); line-height: 1.5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); }

.login-container { width: 100%; max-width: 360px; }
.logo { width: 80px; height: 80px; margin: 0 auto var(--space-6); background: var(--color-primary); border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center; box-shadow: var(--elevation-2); }
.logo svg { width: 40px; height: 40px; stroke: white; }

.login-header { text-align: center; margin-bottom: var(--space-8); }
.login-header h1 { font-size: var(--text-h1); font-weight: 700; color: var(--color-foreground); margin-bottom: var(--space-2); letter-spacing: -0.01em; }
.login-header p { font-size: var(--text-body); color: var(--color-foreground-muted); }

.form-group { margin-bottom: var(--space-4); }
.form-group label { display: block; font-size: var(--text-caption); font-weight: 500; color: var(--color-foreground-muted); margin-bottom: var(--space-2); letter-spacing: 0.02em; }
.form-group input { width: 100%; height: 44px; padding: 0 var(--space-4); font-size: var(--text-body); font-family: inherit; color: var(--color-foreground); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm); transition: border-color 150ms ease, box-shadow 150ms ease; }
.form-group input::placeholder { color: var(--color-foreground-muted); opacity: 0.6; }
.form-group input:hover { border-color: var(--color-border-strong); }
.form-group input:focus { outline: none; border-color: var(--color-ring); box-shadow: 0 0 0 3px var(--color-primary-light); }
.form-group input:disabled { background: var(--color-muted); color: var(--color-foreground-muted); cursor: not-allowed; }
.form-group.error input { border-color: var(--color-destructive); background: var(--color-destructive-light); }
.form-group.error input:focus { box-shadow: 0 0 0 3px var(--color-destructive-light); }
.form-error { font-size: var(--text-caption); color: var(--color-destructive); margin-top: var(--space-1); display: flex; align-items: center; gap: var(--space-1); }

.btn { width: 100%; height: 48px; padding: 0 var(--space-5); font-size: var(--text-button); font-weight: 600; font-family: inherit; border: none; border-radius: var(--radius-md); cursor: pointer; transition: all 150ms ease; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); touch-action: manipulation; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--color-primary); color: white; }
.btn-primary:not(:disabled):hover { background: var(--color-primary-hover); }
.btn-secondary { background: var(--color-surface); color: var(--color-primary); border: 1px solid var(--color-border); }
.btn-secondary:not(:disabled):hover { background: var(--color-primary-light); border-color: var(--color-primary); }
.btn-tertiary { background: transparent; color: var(--color-primary); }
.btn-tertiary:not(:disabled):hover { background: var(--color-primary-light); }

.login-footer { text-align: center; margin-top: var(--space-6); font-size: var(--text-body-sm); color: var(--color-foreground-muted); }
.login-footer a { color: var(--color-secondary); text-decoration: none; font-weight: 500; }
.login-footer a:hover { text-decoration: underline; }
.divider { display: flex; align-items: center; gap: var(--space-4); margin: var(--space-6) 0; color: var(--color-foreground-muted); font-size: var(--text-caption); }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="login-container">
  <div class="logo" role="img" aria-label="Stash logo">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5"/><path d="M16 7l-5 5 5 5"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
  </div>
  <header class="login-header">
    <h1>Welcome back</h1>
    <p>Sign in to access your backed up memories</p>
  </header>
  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      <div class="form-error" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Enter a valid email address</div>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      <div class="form-error" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Password is required</div>
    </div>
    <div class="form-group">
      <label for="deviceId">Device ID</label>
      <input type="text" id="deviceId" name="deviceId" placeholder="Auto-generated or enter your own" autocomplete="off">
      <div class="form-error" hidden></div>
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn">
      <span>Sign in</span>
      <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none; animation: spin 1s linear infinite;"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"/></svg>
    </button>
  </form>
  <div class="divider">or</div>
  <button type="button" class="btn btn-secondary" onclick="showRegister()">Create account</button>
  <footer class="login-footer">
    <p>By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>
  </footer>
</div>
<script>
function showRegister() { alert('Register page would open here'); }
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const spinner = btn.querySelector('.spinner');
  const text = btn.querySelector('span');
  btn.disabled = true; text.textContent = 'Signing in...'; spinner.style.display = 'block';
  await new Promise(r => setTimeout(r, 1500));
  btn.disabled = false; text.textContent = 'Sign in'; spinner.style.display = 'none';
  alert('Login flow would continue to Gallery');
});
['email','password','deviceId'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    const group = document.getElementById(id).closest('.form-group');
    group.classList.remove('error');
    group.querySelector('.form-error').hidden = true;
  });
});
</script>
</body>
</html>
