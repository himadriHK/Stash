<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Folder Configuration</title>
<style>
:root {
  --color-primary: #2563EB; --color-primary-hover: #1D4ED8; --color-primary-light: #DBEAFE;
  --color-secondary: #3B82F6; --color-accent: #059669; --color-background: #F8FAFC;
  --color-surface: #FFFFFF; --color-foreground: #0F172A; --color-foreground-muted: #64748B;
  --color-border: #E2E8F0; --color-border-strong: #CBD5E1; --color-destructive: #DC2626;
  --color-destructive-light: #FEF2F2; --color-warning: #D97706; --color-warning-light: #FFFBEB;
  --color-ring: #2563EB;
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --text-h1: 28px; --text-h2: 22px; --text-h3: 18px; --text-body-lg: 16px; --text-body: 15px;
  --text-body-sm: 13px; --text-caption: 12px; --text-button: 15px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-full: 9999px;
  --elevation-1: 0 1px 2px rgba(15,23,42,0.05); --elevation-2: 0 4px 8px rgba(15,23,42,0.08);
  --header-height: 56px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-primary: #3B82F6; --color-primary-hover: #60A5FA; --color-primary-light: #1E3A5F;
    --color-secondary: #60A5FA; --color-accent: #34D399; --color-background: #0F172A;
    --color-surface: #1E293B; --color-foreground: #F8FAFC; --color-foreground-muted: #94A3B8;
    --color-border: #334155; --color-border-strong: #475569; --color-destructive: #EF4444;
    --color-destructive-light: #450A0A; --color-warning: #FBBF24; --color-warning-light: #451A03;
    --color-ring: #3B82F6; --elevation-1: 0 1px 2px rgba(0,0,0,0.3); --elevation-2: 0 4px 8px rgba(0,0,0,0.4);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body { font-family: var(--font-family); background: var(--color-background); color: var(--color-foreground); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }

.app-header { position: sticky; top: 0; z-index: 100; height: var(--header-height); background: var(--color-background); border-bottom: 1px solid var(--color-border); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-4); }
.app-header h1 { font-size: var(--text-h1); font-weight: 700; letter-spacing: -0.01em; }
.back-btn { width: 40px; height: 40px; border: none; background: transparent; color: var(--color-foreground); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 150ms ease; }
.back-btn:hover { background: var(--color-muted); }
.back-btn svg { width: 24px; height: 24px; }

.settings-content { flex: 1; overflow-y: auto; padding: var(--space-4); }

.section { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: var(--space-4); overflow: hidden; }
.section-header { padding: var(--space-3) var(--space-4); font-size: var(--text-caption); font-weight: 600; color: var(--color-foreground-muted); text-transform: uppercase; letter-spacing: 0.05em; background: var(--color-background); border-bottom: 1px solid var(--color-border); }
.section:first-child .section-header { border-top: none; }

.folder-list { max-height: 400px; overflow-y: auto; }
.folder-item { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); min-height: 56px; }
.folder-item:last-child { border-bottom: none; }
.folder-info { flex: 1; min-width: 0; }
.folder-name { font-size: var(--text-body); font-weight: 500; color: var(--color-foreground); margin-bottom: var(--space-1); }
.folder-path { font-size: var(--text-caption); color: var(--color-foreground-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
.folder-actions .icon-btn { width: 32px; height: 32px; }

.folder-item.folder-item--has-subfolder .folder-name { color: var(--color-primary); }
.folder-item.folder-item--has-subfolder .folder-name::after { content: '▼'; font-size: 10px; color: var(--color-primary); margin-left: var(--space-1); }

.add-folder { display: flex; align-items: center; justify-content: center; padding: var(--space-4); border: 2px dashed var(--color-border); border-radius: var(--radius-md); color: var(--color-foreground-muted); cursor: pointer; transition: all 150ms ease; height: 120px; }
.add-folder:hover { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-primary-light); }
.add-folder svg { width: 32px; height: 32px; stroke: currentColor; margin-right: var(--space-2); }

.add-folder-form { display: none; padding: var(--space-4); background: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border); }
.add-folder-form.visible { display: block; }
.add-folder-form .form-group { margin-bottom: var(--space-3); }
.add-folder-form .form-group label { display: block; font-size: var(--text-caption); font-weight: 500; color: var(--color-foreground-muted); margin-bottom: var(--space-1); }
.add-folder-form .form-group input { width: 100%; height: 40px; padding: 0 var(--space-3); font-size: var(--text-body); font-family: inherit; color: var(--color-foreground); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
.add-folder-form .form-group input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-light); }
.add-folder-form .form-row { display: flex; gap: var(--space-3); }
.add-folder-form .form-row > div { flex: 1; }

.footer-actions { display: flex; justify-content: flex-end; padding: var(--space-4) 0; gap: var(--space-3); }

/* Touch indicator */
.touch-indicator { position: fixed; bottom: 0; right: 0; width: 48px; height: 48px; background: var(--color-primary); color: white; display: none; align-items: center; justify-content: center; font-size: 12px; border-radius: 0 0 0 var(--radius-full); z-index: 100; pointer-events: none; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="app-header" role="banner">
  <button class="back-btn" onclick="history.back()" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  </button>
  <h1>Folders</h1>
</header>

<main class="settings-content" role="main">
  <!-- Folder List -->
  <section class="section" aria-labelledby="folder-list-heading">
    <header class="section-header" id="folder-list-heading">Your Folders</header>
    <div class="folder-list" id="folderList">
      <!-- Folder items injected by JS -->
    </div>
    <div class="add-folder" id="addFolderBtn" role="button" aria-label="Add folder" tabindex="0" onclick="toggleAddFolderForm()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Add Folder</span>
    </div>
    <div class="add-folder-form" id="addFolderForm" hidden>
      <div class="form-group">
        <label for="folderPath">Folder Path</label>
        <input type="text" id="folderPath" placeholder="/Users/name/Pictures" readonly>
        <button type="button" class="btn btn-secondary" style="height: 40px; width: 100%; padding: 0 var(--space-3);" onclick="browseForFolder()">Choose</button>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="includePatterns">Include Patterns</label>
          <input type="text" id="includePatterns" placeholder="*.jpg, *.png, *.mov, *.mp4">
        </div>
        <div class="form-group">
          <label for="excludePatterns">Exclude Patterns</label>
          <input type="text" id="excludePatterns" placeholder="*.tmp, *.cache">
        </div>
      </div>
      <div class="form-group">
        <label for="includeSubfolders">Include Subfolders</label>
        <select class="btn btn-secondary" style="height: 40px; padding: 0 var(--space-3);">
          <option value="true" selected>Yes</option>
          <option value="false">No</option>
        </select>
      </div>
      <div class="footer-actions">
        <button class="btn btn-primary" onclick="saveNewFolder()">Add Folder</button>
        <button class="btn btn-secondary" onclick="toggleAddFolderForm()">Cancel</button>
      </div>
    </div>
  </section>

  <!-- Folder Details (when selected) -->
  <section class="section" aria-labelledby="folder-details-heading" hidden>
    <header class="section-header" id="folder-details-heading">Folder Details</header>
    <div class="setting-item">
      <div class="setting-info">
        <div class="setting-label">Path</div>
        <div class="setting-value" id="folderPathDetail"></div>
      </div>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <div class="setting-label">Status</div>
        <div class="setting-value" id="folderStatus">Active</div>
      </div>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <div class="setting-label">Last Scanned</div>
        <div class="setting-value" id="folderLastScanned">—</div>
      </div>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <div class="setting-label">Files</div>
        <div class="setting-value" id="folderFilesCount">0</div>
      </div>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <div class="setting-label">Include Patterns</div>
        <div class="setting-value" id="folderIncludePatterns">—</div>
      </div>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <div class="setting-label">Exclude Patterns</div>
        <div class="setting-value" id="folderExcludePatterns">—</div>
      </div>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <div class="setting-label">Subfolders</div>
        <div class="setting-value" id="folderSubfolders">—</div>
      </div>
    </div>
  </section>

  <!-- Touch indicator -->
  <div class="touch-indicator" id="touchIndicator" aria-label="Touch mode active">Tap</div>
</main>

<script>
// Mock folder data
const mockFolders = [
  { id: 1, path: '/Users/name/Pictures', name: 'Pictures', lastScanned: '2 hours ago', filesCount: 1247, subfolders: true, include: ['*.jpg', '*.jpeg', '*.png', '*.heic', '*.mov'], exclude: ['*.tmp', '*.cache'], hasSubfolders: true },
  { id: 2, path: '/Users/name/Downloads', name: 'Downloads', lastScanned: 'yesterday', filesCount: 89, subfolders: false, include: ['*.pdf', '*.doc'], exclude: ['*.temp'], hasSubfolders: false },
  { id: 3, path: '/Users/name/Movies', name: 'Movies', lastScanned: '3 days ago', filesCount: 45, subfolders: true, include: ['*.mov', '*.mp4', '*.avi'], exclude: [], hasSubfolders: true },
];

const folderList = document.getElementById('folderList');
const addFolderBtn = document.getElementById('addFolderBtn');
const addFolderForm = document.getElementById('addFolderForm');
const folderDetails = document.querySelector('#folder-details-heading');
const folderDetailsSection = document.querySelector('section[aria-labelledby="folder-details-heading"]');

function renderFolders() {
  folderList.innerHTML = '';
  mockFolders.forEach((folder, idx) => {
    const div = document.createElement('div');
    div.className = 'folder-item' + (folder.hasSubfolders ? ' folder-item--has-subfolder' : '');
    div.role = 'listitem';
    div.dataset.id = folder.id;
    div.tabIndex = 0;
    div.innerHTML = `
      <div class="folder-info">
        <div class="folder-name">${folder.name}</div>
        <div class="folder-path">${folder.path}</div>
      </div>
      <div class="folder-actions">
        <button class="icon-btn" aria-label="Edit folder" onclick="editFolder(${folder.id})" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4.5 2.5L7.271 7.271a2.121 2.121 0 0 1 0-3L12 4l4.5-2.5a2.121 2.121 0 0 1 3 3z"/></svg></button>
        <button class="icon-btn" aria-label="Delete folder" onclick="deleteFolder(${folder.id})" title="Delete" style="color: var(--color-destructive);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
    `;
    div.addEventListener('click', () => showFolderDetails(folder.id));
    div.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showFolderDetails(folder.id); } });
    folderList.appendChild(div);
  });
  updateTouchIndicator();
}

function showFolderDetails(id) {
  const folder = mockFolders.find(f => f.id === id);
  if (!folder) return;
  
  document.getElementById('folderPathDetail').textContent = folder.path;
  document.getElementById('folderStatus').textContent = folder.hasSubfolders ? 'Active' : 'Inactive';
  document.getElementById('folderLastScanned').textContent = folder.lastScanned;
  document.getElementById('folderFilesCount').textContent = folder.filesCount;
  document.getElementById('folderIncludePatterns').textContent = folder.include.join(', ');
  document.getElementById('folderExcludePatterns').textContent = folder.exclude.join(', ');
  
  // Hide folder list, show details
  folderList.hidden = true;
  folderDetailsSection.hidden = false;
}

function toggleAddFolderForm() {
  addFolderForm.classList.toggle('visible');
  if (addFolderForm.classList.contains('visible')) {
    addFolderBtn.textContent = 'Cancel';
    document.getElementById('folderPath').focus();
  } else {
    addFolderBtn.textContent = 'Add Folder';
  }
}

function saveNewFolder() {
  const path = document.getElementById('folderPath').value;
  if (!path) {
    alert('Please enter a folder path');
    return;
  }
  alert(`Folder "${path}" added (would update StashConfig and rescan)`);
  toggleAddFolderForm();
  renderFolders();
}

function browseForFolder() {
  // In real app: use OS file picker
  const path = prompt('Enter folder path:', '/Users/name/Pictures');
  if (path) document.getElementById('folderPath').value = path;
}

function editFolder(id) {
  alert(`Edit folder ${id} (would open path editor)`);
}

function deleteFolder(id) {
  if (confirm('Delete folder and all its contents?')) {
    alert(`Folder ${id} deleted (would remove from StashConfig)`);
    renderFolders();
  }
}

// Touch indicator
function updateTouchIndicator() {
  const touchIndicator = document.getElementById('touchIndicator');
  // Simple check - if touch events are supported
  touchIndicator.style.display = 'flex';
}

// Initialize
renderFolders();
</script>
</body>
</html>
